name: CI Build (fetch Google Drive materials)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      GOOGLE_DRIVE_SHARED_ENDPOINT: ${{ vars.GOOGLE_DRIVE_SHARED_ENDPOINT || secrets.GOOGLE_DRIVE_SHARED_ENDPOINT || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure GOOGLE_DRIVE_SHARED_ENDPOINT is set (fail fast)
        run: |
          if [ -z "$GOOGLE_DRIVE_SHARED_ENDPOINT" ]; then
            echo "Environment variable GOOGLE_DRIVE_SHARED_ENDPOINT is not set. Failing CI."
            exit 1
          fi

      - name: Info - fetch will run via prebuild
        run: echo "Fetch occurs in prebuild via 'node ./scripts/generate-data.mjs'"

      - name: Build
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
